name: Build macOS libmpv with Nix deps

on:
  push:
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: Upstream mpv ref to build
        required: false
        default: master
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPV_DEFAULT_REF: master
  MPV_REPOSITORY: mpv-player/mpv

jobs:
  build-macos:
    name: Build macOS ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact_suffix: arm64
            target: "11.0"
          - os: macos-15-intel
            artifact_suffix: x86_64
            target: "11.0"

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v6

      - name: Resolve upstream ref
        id: upstream
        shell: bash
        env:
          MANUAL_REF: ${{ github.event.inputs.mpv_ref }}
        run: |
          ref="${MPV_DEFAULT_REF}"

          if [[ -n "$MANUAL_REF" ]]; then
            ref="$MANUAL_REF"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref="${GITHUB_REF_NAME}"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream mpv
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MPV_REPOSITORY }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: mpv
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build libmpv
        id: build
        shell: bash
        env:
          TRAVIS_OS_NAME: ${{ matrix.os }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
          MPV_DEPS_PROVIDER: nix
        run: |
          rm -rf "$HOME/out/mpv"
          nix develop .#libmpv-macos -c \
            bash ./scripts/build_macos_libmpv_qt.sh "$GITHUB_WORKSPACE/mpv"

      - name: Verify libmpv output
        shell: bash
        run: |
          ls -l "$HOME/out/mpv/lib"
          test -e "$HOME/out/mpv/lib/libmpv.dylib"
          minos="$(otool -l "$HOME/out/mpv/lib/libmpv.dylib" | awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')"
          if [[ -z "$minos" ]]; then
            minos="$(otool -l "$HOME/out/mpv/lib/libmpv.dylib" | awk '/LC_VERSION_MIN_MACOSX/{found=1} found && /version/{print $2; exit}')"
          fi
          echo "libmpv.dylib minos: ${minos}"
          test "$minos" = "${{ matrix.target }}"
          if otool -L "$HOME/out/mpv/lib/libmpv.dylib" | grep -Fq '/usr/lib/swift/'; then
            echo "libmpv.dylib must not link against Swift runtime libraries." >&2
            otool -L "$HOME/out/mpv/lib/libmpv.dylib" >&2
            exit 1
          fi

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        working-directory: mpv
        shell: bash
        run: |
          if [[ -f ./build/meson-logs/meson-log.txt ]]; then
            cat ./build/meson-logs/meson-log.txt
          else
            echo "meson-log.txt was not created."
          fi

      - name: Detect mpv version
        id: version
        shell: bash
        run: |
          version_file="$(find mpv -path '*/common/version.h' -type f | head -n 1)"

          if [[ -z "$version_file" ]]; then
            echo "Failed to locate common/version.h" >&2
            exit 1
          fi

          version="$(grep VERSION "$version_file" | cut -d'"' -f2)"

          if [[ -z "$version" ]]; then
            echo "Failed to parse version from $version_file" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package libmpv bundle
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          nix develop .#libmpv-macos -c \
            bash ./scripts/package_libmpv.sh \
              --arch "${{ matrix.artifact_suffix }}" \
              --install-prefix "$HOME/out/mpv" \
              --source-dir "$GITHUB_WORKSPACE/mpv" \
              --version "${{ steps.version.outputs.version }}" \
              --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Verify packaged dylibs
        shell: bash
        run: |
          package="dist/libmpv-${{ steps.version.outputs.version }}-macos-${{ matrix.artifact_suffix }}.tar.gz"
          check_dir="$RUNNER_TEMP/libmpv-check"
          target="${{ matrix.target }}"
          rm -rf "$check_dir"
          mkdir -p "$check_dir"
          tar -xzf "$package" -C "$check_dir"
          if find "$check_dir" -name 'libcaca*.dylib' -print -quit | grep -q .; then
            echo "libcaca must not be packaged for the Qt libmpv build." >&2
            find "$check_dir" -name 'libcaca*.dylib' >&2
            exit 1
          fi
          if find "$check_dir" \( -name 'libvulkan*.dylib' -o -name 'libplacebo*.dylib' -o -name 'libshaderc*.dylib' \) -print -quit | grep -q .; then
            echo "Vulkan/libplacebo/shaderc dylibs must not be packaged for the OpenGL-only Qt libmpv build." >&2
            find "$check_dir" \( -name 'libvulkan*.dylib' -o -name 'libplacebo*.dylib' -o -name 'libshaderc*.dylib' \) >&2
            exit 1
          fi
          version_code() {
            IFS=. read -r major minor patch <<< "$1"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            echo "$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
          }
          target_code="$(version_code "$target")"
          failed=0
          while IFS= read -r dylib; do
            minos="$(otool -l "$dylib" | awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')"
            if [[ -z "$minos" ]]; then
              minos="$(otool -l "$dylib" | awk '/LC_VERSION_MIN_MACOSX/{found=1} found && /version/{print $2; exit}')"
            fi
            echo "${dylib#$check_dir/}: minos ${minos:-unknown}"
            if [[ -n "$minos" && "$(version_code "$minos")" -gt "$target_code" ]]; then
              echo "${dylib#$check_dir/} was built for macOS ${minos}, above target ${target}" >&2
              failed=1
            fi
            if otool -L "$dylib" | grep -Eq '/opt/homebrew|/usr/local|/Users/runner|/nix/store'; then
              echo "${dylib#$check_dir/} contains non-relocatable dependency paths" >&2
              otool -L "$dylib" >&2
              failed=1
            fi
            if otool -L "$dylib" | grep -Fq '/usr/lib/swift/'; then
              echo "${dylib#$check_dir/} links Swift runtime libraries" >&2
              otool -L "$dylib" >&2
              failed=1
            fi
          done < <(find "$check_dir" -name '*.dylib' -type f | sort)
          exit "$failed"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact_suffix }}
          path: dist/libmpv-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          notes_file="$RUNNER_TEMP/release-notes.txt"

          cat > "$notes_file" <<EOF
          Built from upstream ${MPV_REPOSITORY}@${tag} using this repository's Nix dependency shell.

          Included artifacts:
          - OpenGL-only libmpv bundles for arm64 and x86_64
          EOF

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/libmpv-*.tar.gz --repo "$repo" --clobber
          else
            gh release create "$tag" dist/libmpv-*.tar.gz \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes_file"
          fi
