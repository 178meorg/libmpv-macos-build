name: Build macOS libmpv from source

on:
  push:
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: mpv ref to build
        required: false
        default: master
        type: string
      skip_cache:
        description: Ignore dependency source cache
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MPV_DEFAULT_REF: master

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Resolve mpv ref
        id: ref
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.mpv_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ref="$REF_NAME"
          else
            ref="${INPUT_REF:-${MPV_DEFAULT_REF}}"
          fi
          echo "mpv_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Cache source archives
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_cache == false }}
        uses: actions/cache@v6.1.0
        with:
          path: third_party/src/archives
          key: src-${{ hashFiles('third_party/manifest/deps.env') }}
          restore-keys: src-

      - name: Fetch third-party sources
        shell: bash
        env:
          MPV_REF: ${{ steps.ref.outputs.mpv_ref }}
          MPV_SOURCE_REF: master
        run: third_party/scripts/fetch.sh

      - name: Build libmpv dependency stack
        shell: bash
        env:
          MPV_REF: ${{ steps.ref.outputs.mpv_ref }}
        run: |
          third_party/scripts/build-all.sh \
            --arch "${{ matrix.arch }}" \
            --target "${MACOSX_DEPLOYMENT_TARGET}" \
            --profile enhanced-lgpl

      - name: Audit install prefix
        shell: bash
        run: |
          prefix="third_party/install/macos-${{ matrix.arch }}"
          third_party/scripts/audit-macos-minver.sh "$prefix" "${MACOSX_DEPLOYMENT_TARGET}"
          third_party/scripts/audit-rpaths.sh "$prefix"
          third_party/scripts/audit-forbidden-paths.sh "$prefix"

      - name: Package libmpv bundle
        shell: bash
        env:
          MPV_REF: ${{ steps.ref.outputs.mpv_ref }}
        run: |
          third_party/scripts/package-libmpv.sh \
            --arch "${{ matrix.arch }}" \
            --target "${MACOSX_DEPLOYMENT_TARGET}" \
            --profile enhanced-lgpl

      - name: Audit packaged bundle
        shell: bash
        run: |
          pkg="$(find dist -name 'libmpv-*-macos-${{ matrix.arch }}.tar.gz' -type f | head -n 1)"
          test -n "$pkg"
          check_dir="$RUNNER_TEMP/libmpv-check"
          rm -rf "$check_dir"
          mkdir -p "$check_dir"
          tar -xzf "$pkg" -C "$check_dir"
          third_party/scripts/audit-macos-minver.sh "$check_dir" "${MACOSX_DEPLOYMENT_TARGET}"
          third_party/scripts/audit-rpaths.sh "$check_dir"
          third_party/scripts/audit-forbidden-paths.sh "$check_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libmpv-macos-${{ matrix.arch }}
          path: dist/libmpv-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: libmpv-macos-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="$RUNNER_TEMP/release-notes.txt"
          {
            echo "Built from pinned source dependencies for macOS 11.0+."
            echo
            echo "Artifacts:"
            echo "- arm64 libmpv bundle"
            echo "- x86_64 libmpv bundle"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              gh release delete-asset "$tag" "$asset" --yes
            done < <(gh release view "$tag" --json assets --jq '.assets[].name | select(startswith("libmpv-") and endswith(".tar.gz"))')
            gh release upload "$tag" dist/libmpv-*.tar.gz --clobber
          else
            gh release create "$tag" dist/libmpv-*.tar.gz \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes_file"
          fi
