name: Release libmpv macOS bundles

on:
  push:

permissions:
  contents: write

env:
  MPV_VERSION: 0.38.0

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package libmpv bundle
        run: ./scripts/package_libmpv.sh --arch "${{ matrix.arch }}" --output-dir "$RUNNER_TEMP/dist"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libmpv-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Includes:
            - IINA prebuilt macOS dylibs
            - mpv ${{ env.MPV_VERSION }} headers

            Package layout:
            - include/mpv/*.h
            - lib/*.dylib
