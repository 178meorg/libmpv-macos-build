name: Release libmpv macOS bundles

on:
  push:

permissions:
  contents: write

env:
  MPV_VERSION: 0.38.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package libmpv bundle
        run: ./scripts/package_libmpv.sh --arch "${{ matrix.arch }}" --output-dir "$RUNNER_TEMP/dist"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: libmpv-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes_file="$RUNNER_TEMP/release-notes.txt"

          cat > "$notes_file" <<EOF
          Includes:
          - IINA prebuilt macOS dylibs
          - mpv ${MPV_VERSION} headers

          Package layout:
          - include/mpv/*.h
          - lib/*.dylib
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.tar.gz \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes_file"
          fi
