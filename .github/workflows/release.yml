name: Release libmpv macOS bundles

on:
  push:

permissions:
  contents: write

env:
  MPV_VERSION: 0.38.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-headers:
    name: Prepare mpv headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch mpv headers
        run: ./scripts/fetch_mpv_headers.sh --output-dir "$RUNNER_TEMP/headers"

      - name: Upload header artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpv-headers
          path: ${{ runner.temp }}/headers
          if-no-files-found: error

  download-arm64-dylibs:
    name: Download arm64 dylibs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download arm64 dylibs
        run: ./scripts/download_iina_libs.sh --arch arm64 --output-dir "$RUNNER_TEMP/libs"

      - name: Upload arm64 dylib artifact
        uses: actions/upload-artifact@v7
        with:
          name: iina-dylibs-arm64
          path: ${{ runner.temp }}/libs
          if-no-files-found: error

  download-x86_64-dylibs:
    name: Download x86_64 dylibs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download x86_64 dylibs
        run: ./scripts/download_iina_libs.sh --arch x86_64 --output-dir "$RUNNER_TEMP/libs"

      - name: Upload x86_64 dylib artifact
        uses: actions/upload-artifact@v7
        with:
          name: iina-dylibs-x86_64
          path: ${{ runner.temp }}/libs
          if-no-files-found: error

  package-arm64:
    name: Package arm64 bundle
    runs-on: ubuntu-latest
    needs:
      - prepare-headers
      - download-arm64-dylibs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download header artifact
        uses: actions/download-artifact@v8
        with:
          name: mpv-headers
          path: ${{ runner.temp }}/headers

      - name: Download arm64 dylib artifact
        uses: actions/download-artifact@v8
        with:
          name: iina-dylibs-arm64
          path: ${{ runner.temp }}/libs

      - name: Package arm64 bundle
        run: ./scripts/package_libmpv.sh --arch arm64 --headers-dir "$RUNNER_TEMP/headers" --libs-dir "$RUNNER_TEMP/libs" --output-dir "$RUNNER_TEMP/dist"

      - name: Upload arm64 package
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-arm64
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  package-x86_64:
    name: Package x86_64 bundle
    runs-on: ubuntu-latest
    needs:
      - prepare-headers
      - download-x86_64-dylibs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download header artifact
        uses: actions/download-artifact@v8
        with:
          name: mpv-headers
          path: ${{ runner.temp }}/headers

      - name: Download x86_64 dylib artifact
        uses: actions/download-artifact@v8
        with:
          name: iina-dylibs-x86_64
          path: ${{ runner.temp }}/libs

      - name: Package x86_64 bundle
        run: ./scripts/package_libmpv.sh --arch x86_64 --headers-dir "$RUNNER_TEMP/headers" --libs-dir "$RUNNER_TEMP/libs" --output-dir "$RUNNER_TEMP/dist"

      - name: Upload x86_64 package
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-arm64
      - package-x86_64
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: libmpv-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          notes_file="$RUNNER_TEMP/release-notes.txt"

          cat > "$notes_file" <<EOF
          Includes:
          - IINA prebuilt macOS dylibs
          - mpv ${MPV_VERSION} headers

          Package layout:
          - include/mpv/*.h
          - lib/*.dylib
          EOF

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.tar.gz \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              --notes-file "$notes_file"
          fi
